interface_version: "1.0"
confidence_threshold: 0.80
confirmation_threshold: 0.65

# 只映射当前 enabled 且 allowed_sources 含 VOICE 的任务
# Bridge 必须在运行时检查 task_catalog 的 enabled 和 allowed_sources
# Task 7 永远不允许语音解除急停
# "前方 5 米" 等空间语句不进入此映射，属于未来 SpatialGoalRequest
# confirmation_threshold 为 reserved/example only; does not set TaskCommand.user_confirmed

mappings:
  2: ["暂停", "先停一下"]
  3: ["继续", "继续清扫"]
  4: ["停止任务", "结束任务"]
  6: ["紧急停止", "立即停止"]
  30: ["清扫最近的落叶", "去清扫落叶"]
  31: ["清扫最近的落叶堆"]
  32: ["清扫最近的积水", "去清扫积水"]

# Task 7 (reset emergency stop) intentionally not mapped to voice
